name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run it by hand from the Actions tab

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (warnings are errors)
        run: |
          swift build -c release -Xswiftc -warnings-as-errors
          ./build.sh
      - name: Test
        run: swift test
      # macOS's bash 3.2 reads a UTF-8 byte after "$var" as part of the name under
      # set -u ("ref…" -> unbound variable), so the scripts users pipe into bash stay ASCII.
      - name: Install scripts are ASCII-only
        run: "! LC_ALL=C grep -n '[^[:print:][:space:]]' install.sh build.sh"
      - name: Installer parses in a UTF-8 shell
        run: LC_ALL=en_US.UTF-8 /bin/bash -n install.sh
